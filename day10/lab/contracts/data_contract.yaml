# Data contract — Lab Day 10 (tiếp nối artifact CS + IT Helpdesk)
# Sinh viên bổ sung owner, SLA freshness, và nguồn canonical.

version: "1.1"
dataset: "kb_chunk_export"
owner_team: "data-engineering"
owner_contact: "dunglk85@github"
description: "Knowledge base chunk export — cleaned, validated, embedded vào ChromaDB phục vụ RAG retrieval."

schema_cleaned:
  chunk_id:
    type: string
    required: true
    description: "ID ổn định sau clean (thường hash hoặc doc_id + seq)"
  doc_id:
    type: string
    required: true
    description: "Khóa logic tài liệu nguồn (vd policy_refund_v4)"
  chunk_text:
    type: string
    required: true
    constraints:
      min_length: 8
  effective_date:
    type: date
    required: true
  exported_at:
    type: datetime
    required: true

quality_rules:
  - id: "no_duplicate_chunk_text"
    severity: "warn"
  - id: "no_stale_refund_window"
    description: "Không được để chunk policy refund chứa cửa sổ 14 ngày (lệch so với v4 = 7 ngày)"
    severity: "halt"
  # --- NEW RULES (nhóm bổ sung) ---
  - id: "strip_cleaned_tags"
    description: "Strip leftover [cleaned: ...] tags từ lần ingest trước — chống tag accumulation"
    severity: "transform"
    metric_impact: "faithfulness giảm nếu LLM đọc marker nội bộ"
  - id: "quarantine_migration_notes"
    description: "Quarantine chunk chứa migration/debug notes (bản sync cũ, lỗi migration)"
    severity: "halt"
    metric_impact: "answer_relevance giảm do noise nội bộ trong retrieval"
  - id: "validate_exported_at_iso"
    description: "exported_at phải đúng ISO 8601 datetime — quarantine nếu sai"
    severity: "halt"
    metric_impact: "freshness_sla check sai nếu exported_at lỗi format"
  - id: "no_migration_notes_in_cleaned"
    description: "Expectation halt: không còn migration note trong cleaned output"
    severity: "halt"
  - id: "exported_at_within_30d"
    description: "Expectation warn: exported_at không được quá 30 ngày — cảnh báo dữ liệu stale"
    severity: "warn"

freshness:
  measured_at: "publish"  # ingest | cleaned | publish
  sla_hours: 24
  alert_channel: "slack:#data-quality-alerts"
  escalation: "Nếu FAIL > 48h liên tiếp → escalate lên team lead qua email."
  check_frequency: "mỗi pipeline run (trigger bởi cron hoặc manual)"

canonical_sources:
  - path: "data/docs/policy_refund_v4.txt"
    doc_id: "policy_refund_v4"
    owner: "CS Operations"
    version: "v4"
    note: "Source of truth cho chính sách hoàn tiền. Cửa sổ = 7 ngày làm việc."
  - path: "data/docs/sla_p1_2026.txt"
    doc_id: "sla_p1_2026"
    owner: "IT Service Management"
    version: "2026"
    note: "SLA P1: first response 15 phút, resolution 4 giờ."
  - path: "data/docs/it_helpdesk_faq.txt"
    doc_id: "it_helpdesk_faq"
    owner: "IT Helpdesk"
    version: "latest"
    note: "FAQ tổng hợp — cập nhật rolling. Lockout = 5 lần sai."
  - path: "data/docs/hr_leave_policy.txt"
    doc_id: "hr_leave_policy"
    owner: "HR Department"
    version: "2026"
    note: "Chính sách nghỉ phép 2026. Canonical: 12 ngày phép/năm (<3 năm KN). Bản 2025 (10 ngày) phải bị quarantine."

# Baseline allowlist export — nhóm mở rộng doc mới phải đồng bộ cleaning_rules + contract.
allowed_doc_ids:
  - policy_refund_v4
  - sla_p1_2026
  - it_helpdesk_faq
  - hr_leave_policy

# Merit/Distinction: có thể đưa cutoff versioning vào env và tham chiếu ở đây (tránh hard-code trong code).
policy_versioning:
  hr_leave_min_effective_date: "2026-01-01"
